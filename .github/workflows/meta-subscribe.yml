# Subscribes the WhatsApp Business Account to this app so Meta delivers its
# messages to the webhook (not always automatic, notably for the test number).
name: Meta - subscribe WABA to app

on:
  workflow_dispatch:
    inputs:
      waba_id:
        description: WhatsApp Business Account ID
        required: true
      callback_url:
        description: Optional. Force this WABA's webhooks to this URL (override_callback_uri)
        required: false

permissions:
  contents: read

jobs:
  subscribe:
    runs-on: ubuntu-latest
    steps:
      - name: Subscribe and check
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WABA: ${{ inputs.waba_id }}
          CALLBACK: ${{ inputs.callback_url }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
        run: |
          api=https://graph.facebook.com/v21.0/$WABA/subscribed_apps
          echo "== before"; curl -s -H "Authorization: Bearer $WA_TOKEN" "$api"; echo
          if [ -n "$CALLBACK" ]; then
            echo "== subscribe with callback override"
            curl -s -X POST -H "Authorization: Bearer $WA_TOKEN" --data-urlencode "override_callback_uri=$CALLBACK" --data-urlencode "verify_token=$WA_VERIFY_TOKEN" "$api"; echo
          else
            echo "== subscribe"; curl -s -X POST -H "Authorization: Bearer $WA_TOKEN" "$api"; echo
          fi
          echo "== after"; curl -s -H "Authorization: Bearer $WA_TOKEN" "$api?fields=whatsapp_business_api_data,override_callback_uri"; echo
